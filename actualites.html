<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Actualités — Prépa littéraire Jeanne d'Albret</title>
<meta name="description" content="La vie en hypokhâgne et en khâgne au lycée Jeanne d'Albret : sorties, théâtre, conférences, rencontres et réussites.">
<link rel="icon" href="assets/img/logo.jpg">
<meta property="og:title" content="Actualités — Prépa littéraire Jeanne d'Albret">
<meta property="og:description" content="La vie en hypokhâgne et en khâgne au lycée Jeanne d'Albret : sorties, théâtre, conférences, rencontres et réussites.">
<meta property="og:image" content="assets/img/logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..800;1,6..96,400..600&amp;family=Instrument+Sans:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#FFFDF8}
a{color:#B23A0A}a:hover{color:#7A2E0B}
</style>
<style>[hidden]{display:none !important} *{box-sizing:border-box} img,video{max-width:100%} button:focus-visible,a:focus-visible{outline:3px solid #B23A0A;outline-offset:3px}</style>

</head>
<body>
<div style="font-family: 'Instrument Sans', system-ui, sans-serif; color: #1A1712; background: #FFFDF8; font-size: 17px; line-height: 1.6">
<header style="border-bottom: 1px solid #E7DFCC; background: #FFFDF8">
<nav aria-label="Navigation principale" style="max-width: 1240px; margin: 0 auto; padding: 14px 32px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px">
<a href="index.html" style="display: flex; align-items: center; gap: 12px; text-decoration: none; color: #1A1712">
<img src="assets/img/logo.jpg" alt="Logo Oser Jeanne, Saint-Germain-en-Laye" style="width: 52px; height: 52px; border-radius: 50%; object-fit: cover">
<span style="display: flex; flex-direction: column; line-height: 1.15">
<span style="font-family: 'Bodoni Moda', serif; font-size: 20px; font-weight: 600">Prépa littéraire</span>
<span style="font-size: 13px; color: #5E574A; letter-spacing: 0.04em">Lycée Jeanne d'Albret</span>
</span>
</a>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px 22px; font-size: 15px; font-weight: 500">
<a href="index.html" style="color: #1A1712; text-decoration: none; padding: 10px 0">Accueil</a>
<a href="index.html" style="color: #1A1712; text-decoration: none; padding: 10px 0">Cursus</a>
<a href="index.html" style="color: #1A1712; text-decoration: none; padding: 10px 0">Admission</a>
<a href="actualites.html" aria-current="page" style="color: #B23A0A; text-decoration: none; padding: 10px 0; border-bottom: 2px solid #B23A0A">Actualités</a>
<a href="temoignages.html" style="color: #1A1712; text-decoration: none; padding: 10px 0">Témoignages</a>
<a href="https://www.parcoursup.fr" style="background: #1A1712; color: #FFFDF8; text-decoration: none; padding: 12px 20px; border-radius: 999px; font-weight: 600">Candidater</a>
</div>
</nav>
</header>
<main id="app" style="min-height: 60vh"><p style="max-width: 1240px; margin: 0 auto; padding: 120px 32px; font-family: 'Bodoni Moda', serif; font-size: 28px; color: #5E574A">Chargement des actualités…</p></main>
<div id="lightbox" role="dialog" aria-modal="true" aria-label="Image agrandie" hidden style="position: fixed; inset: 0; z-index: 50; background: rgba(20,18,14,0.92); display: flex; align-items: center; justify-content: center; padding: 24px">
<button type="button" id="lb-close" aria-label="Fermer l'image" style="position: absolute; top: 16px; right: 16px; width: 48px; height: 48px; border-radius: 50%; border: 0; background: #FFFDF8; color: #1A1712; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
<img id="lb-img" src="" alt="" style="max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 8px">
</div>
<footer style="background: #1A1712; color: #D9D1BF">
<div style="max-width: 1240px; margin: 0 auto; padding: 48px 32px; display: flex; flex-wrap: wrap; gap: 24px; justify-content: space-between; align-items: center">
<div style="display: flex; align-items: center; gap: 16px">
<img src="assets/img/logo.jpg" alt="" style="width: 56px; height: 56px; border-radius: 50%; object-fit: cover">
<p style="margin: 0; font-family: 'Bodoni Moda', serif; font-size: 22px; font-style: italic; color: #FFFDF8">Oser Jeanne</p>
</div>
<p style="margin: 0; font-size: 14px; max-width: 34em">Lycée Jeanne d'Albret · 6, rue Giraud Teulon · 78100 Saint-Germain-en-Laye · 01 39 04 15 20</p>
<a href="index.html" style="color: #F5B800; font-size: 15px; font-weight: 600; padding: 10px 0">← Retour à l'accueil</a>
</div>
</footer>
</div>
<script>
(function () {
  var app = document.getElementById('app');
  var ALL = [], state = { cat: 'all', level: 'all' };
  var CATS = ['Sorties & musées', 'Théâtre & musique', 'Rencontres & parcours', 'Vie de la prépa', 'Lectures & bibliographies'];
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function pill(on) { return 'font-family: inherit; font-size: 15px; font-weight: 600; padding: 9px 16px; min-height: 44px; border-radius: 999px; cursor: pointer; border: 1.5px solid #1A1712; ' + (on ? 'background: #1A1712; color: #FFFDF8;' : 'background: transparent; color: #1A1712;'); }
  function runs(rs, mode) {
    return rs.map(function (r) {
      var t = esc(r.t);
      if (r.k === 'a') return '<a href="' + esc(r.h) + '" target="_blank" rel="noopener">' + t + '</a>';
      if (mode === 'h') return r.k === 'i' || r.k === 'bi' ? '<em>' + t + '</em>' : t;
      if (mode === 'q') return r.k === 'b' || r.k === 'bi' ? '<strong>' + t + '</strong>' : t;
      if (r.k === 'b') return '<strong>' + t + '</strong>';
      if (r.k === 'i') return '<em>' + t + '</em>';
      if (r.k === 'bi') return '<strong><em>' + t + '</em></strong>';
      return t;
    }).join('');
  }
  function heroImg(a, style) { return a.hero ? '<img src="' + esc(a.hero.u) + '" alt="" loading="lazy" style="' + style + '">' : '<span aria-hidden="true" style="width: 100%; aspect-ratio: 4 / 3; background: #F5B800; display: flex; align-items: center; justify-content: center; font-family: \'Bodoni Moda\', serif; font-style: italic; font-size: 30px; color: #1A1712; padding: 16px; text-align: center">' + esc(a.cat) + '</span>'; }

  function card(a) {
    return '<article style="flex: 1 1 320px; max-width: 100%; background: #FFFFFF; border: 1px solid #E7DFCC; border-radius: 20px; overflow: hidden; display: flex; flex-direction: column">' +
      '<a href="#' + esc(a.id) + '" style="text-decoration: none; color: inherit; display: flex; flex-direction: column; flex-grow: 1">' +
      heroImg(a, 'width: 100%; aspect-ratio: 4 / 3; object-fit: cover; display: block; background: #EDE4D0') +
      '<span style="padding: 22px 24px 24px; display: flex; flex-direction: column; gap: 10px; flex-grow: 1">' +
      '<span style="display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between"><span style="font-size: 13px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #B23A0A">' + esc(a.dateLabel) + '</span><span style="font-size: 13px; font-weight: 600; padding: 3px 11px; border-radius: 999px; background: #F6EFE0; color: #3D372D">' + esc(a.level) + '</span></span>' +
      '<span style="font-family: \'Bodoni Moda\', serif; font-size: 22px; font-weight: 600; line-height: 1.22">' + esc(a.title) + '</span>' +
      '<span style="color: #4A4438; font-size: 15px; line-height: 1.55; flex-grow: 1">' + esc(a.excerpt) + '</span>' +
      '<span style="display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; border-top: 1px solid #EFE8D8; padding-top: 12px; font-size: 14px; color: #5E574A"><span>' + esc(a.cat) + '</span><span style="font-weight: 600; color: #B23A0A">Lire l’article →</span></span>' +
      '</span></a></article>';
  }

  function renderList() {
    document.title = 'Actualités — Prépa littéraire Jeanne d’Albret';
    var f = ALL[0];
    var shown = ALL.filter(function (a) {
      return (state.cat === 'all' || a.cat === state.cat) && (state.level === 'all' || a.level === state.level || a.level === 'Hypokhâgne & khâgne');
    });
    var groups = [], idx = {};
    shown.forEach(function (a) { if (!(a.year in idx)) { idx[a.year] = groups.length; groups.push({ y: a.year, items: [] }); } groups[idx[a.year]].items.push(a); });
    var catBtns = [['all', 'Tous les thèmes']].concat(CATS.map(function (c) { return [c, c]; })).map(function (p) {
      return '<button type="button" data-cat="' + esc(p[0]) + '" aria-pressed="' + (state.cat === p[0]) + '" style="' + pill(state.cat === p[0]) + '">' + esc(p[1]) + '</button>';
    }).join('');
    var lvlBtns = [['all', 'Les deux années'], ['Hypokhâgne', 'Hypokhâgne'], ['Khâgne', 'Khâgne']].map(function (p) {
      return '<button type="button" data-level="' + esc(p[0]) + '" aria-pressed="' + (state.level === p[0]) + '" style="' + pill(state.level === p[0]) + '">' + esc(p[1]) + '</button>';
    }).join('');
    app.innerHTML =
      '<section style="max-width: 1240px; margin: 0 auto; padding: 72px 32px 40px; display: flex; flex-wrap: wrap; gap: 24px 64px; align-items: end">' +
      '<div style="flex: 999 1 520px; min-width: 0; display: flex; flex-direction: column; gap: 18px"><p style="margin: 0; font-size: 14px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #B23A0A">Actualités · ' + ALL.length + ' articles</p>' +
      '<h1 style="margin: 0; font-family: \'Bodoni Moda\', serif; font-weight: 500; font-size: clamp(46px, 6.5vw, 84px); line-height: 1.02">La vie en hypokhâgne<br>&amp; <em style="color: #B23A0A">khâgne</em></h1></div>' +
      '<p style="flex: 1 1 340px; margin: 0; font-size: 19px; color: #3D372D">Théâtre, musées, conférences, rencontres avec d’anciens élèves… Le récit de nos années de prépa, le plus souvent écrit par les étudiants eux-mêmes.</p></section>' +
      '<section aria-label="À la une" style="max-width: 1240px; margin: 0 auto; padding: 0 32px 64px"><article style="background: #1A1712; color: #FFFDF8; border-radius: 28px; overflow: hidden; display: flex; flex-wrap: wrap">' +
      '<a href="#' + esc(f.id) + '" aria-label="Lire : ' + esc(f.title) + '" style="flex: 1 1 460px; min-height: 340px; background: #2A251D; display: block">' + heroImg(f, 'width: 100%; height: 100%; min-height: 340px; max-height: 520px; object-fit: cover; display: block') + '</a>' +
      '<div style="flex: 1 1 420px; padding: 48px; display: flex; flex-direction: column; gap: 18px; justify-content: center">' +
      '<p style="margin: 0; font-size: 13px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #F5B800">À la une · ' + esc(f.dateLabel) + '</p>' +
      '<h2 style="margin: 0; font-family: \'Bodoni Moda\', serif; font-weight: 500; font-size: clamp(28px, 3.2vw, 42px); line-height: 1.12">' + esc(f.title) + '</h2>' +
      '<p style="margin: 0; color: #EDE6D6; font-size: 17px">' + esc(f.excerpt) + '</p>' +
      '<div style="display: flex; flex-wrap: wrap; gap: 12px; align-items: center"><a href="#' + esc(f.id) + '" style="font-size: 16px; font-weight: 600; background: #F5B800; color: #1A1712; text-decoration: none; padding: 14px 24px; border-radius: 999px">Lire l’article</a>' +
      '<span style="border: 1px solid #F5B800; color: #F5B800; padding: 6px 14px; border-radius: 999px; font-size: 14px; font-weight: 600">' + esc(f.level) + '</span></div></div></article></section>' +
      '<section aria-label="Toutes les actualités" style="max-width: 1240px; margin: 0 auto; padding: 0 32px 104px; display: flex; flex-direction: column; gap: 40px">' +
      '<div style="display: flex; flex-direction: column; gap: 14px; border-bottom: 1px solid #E7DFCC; padding-bottom: 24px">' +
      '<div role="group" aria-label="Filtrer par thème" style="display: flex; flex-wrap: wrap; gap: 8px">' + catBtns + '</div>' +
      '<div style="display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between"><div role="group" aria-label="Filtrer par classe" style="display: flex; flex-wrap: wrap; gap: 8px">' + lvlBtns + '</div>' +
      '<p role="status" style="margin: 0; color: #5E574A; font-size: 15px">' + shown.length + (shown.length > 1 ? ' articles affichés' : ' article affiché') + '</p></div></div>' +
      groups.map(function (g) {
        return '<div style="display: flex; flex-direction: column; gap: 24px"><h2 style="margin: 0; font-family: \'Bodoni Moda\', serif; font-weight: 500; font-size: 36px; line-height: 1.1">Année ' + esc(g.y) + ' <span style="font-family: \'Instrument Sans\', sans-serif; font-size: 15px; color: #5E574A; font-weight: 500">' + g.items.length + (g.items.length > 1 ? ' articles' : ' article') + '</span></h2>' +
          '<div style="display: flex; flex-wrap: wrap; gap: 24px">' + g.items.map(card).join('') + '</div></div>';
      }).join('') + '</section>';
    app.querySelectorAll('[data-cat]').forEach(function (b) { b.addEventListener('click', function () { state.cat = b.getAttribute('data-cat'); renderList(); }); });
    app.querySelectorAll('[data-level]').forEach(function (b) { b.addEventListener('click', function () { state.level = b.getAttribute('data-level'); renderList(); }); });
  }

  function block(b) {
    switch (b.k) {
      case 'h': return '<h2 style="margin: 16px 0 0; font-family: \'Bodoni Moda\', serif; font-weight: 600; font-size: 28px; line-height: 1.2; color: #1A1712">' + runs(b.runs, 'h') + '</h2>';
      case 'p': return '<p style="margin: 0; white-space: pre-line">' + runs(b.runs) + '</p>';
      case 'li': return '<p style="margin: 0; padding-left: 26px; position: relative; white-space: pre-line"><span aria-hidden="true" style="position: absolute; left: 4px; top: 0; color: #B23A0A">•</span>' + runs(b.runs) + '</p>';
      case 'quote': return '<blockquote style="margin: 8px 0; padding: 4px 0 4px 24px; border-left: 3px solid #F5B800; font-family: \'Bodoni Moda\', serif; font-size: 21px; line-height: 1.55; font-style: italic; white-space: pre-line">' + runs(b.runs, 'q') + '</blockquote>';
      case 'sig': return '<p style="margin: 8px 0 0; text-align: right; font-size: 16px; color: #3D372D; white-space: pre-line">' + runs(b.runs) + '</p>';
      case 'gal':
        var cols = b.cols || 1, basis = cols === 1 ? '100%' : (cols === 2 ? '280px' : '200px');
        return '<div style="display: flex; flex-wrap: wrap; gap: 12px; margin: 8px 0">' + b.items.map(function (im) {
          return '<button type="button" data-zoom="' + esc(im.u) + '" aria-label="Agrandir l’image" style="flex: 1 1 ' + basis + '; padding: 0; border: 0; background: #EDE4D0; border-radius: 14px; overflow: hidden; cursor: zoom-in; display: block">' +
            '<img src="' + esc(im.u) + '" alt="" loading="lazy" style="' + (cols === 1 ? 'width: 100%; height: auto; display: block' : 'width: 100%; aspect-ratio: 4 / 3; object-fit: cover; display: block') + '"></button>';
        }).join('') + '</div>';
      case 'video': return '<video src="' + esc(b.u) + '" controls preload="metadata" style="width: 100%; border-radius: 16px; background: #1A1712; display: block"></video>';
      case 'table': return '<div style="overflow-x: auto; border: 1px solid #E7DFCC; border-radius: 12px"><table style="border-collapse: collapse; width: 100%; font-size: 15px; line-height: 1.5"><tbody>' +
        b.rows.map(function (r) { return '<tr>' + r.map(function (c) { return '<td style="padding: 10px 14px; border-bottom: 1px solid #EFE8D8; vertical-align: top">' + esc(c) + '</td>'; }).join('') + '</tr>'; }).join('') + '</tbody></table></div>';
    }
    return '';
  }

  function renderArticle(i) {
    var a = ALL[i], newer = ALL[i - 1], older = ALL[i + 1];
    document.title = a.title + ' — Prépa littéraire Jeanne d’Albret';
    app.innerHTML = '<article style="padding-bottom: 96px">' +
      '<div style="max-width: 1100px; margin: 0 auto; padding: 40px 32px 0; display: flex; flex-direction: column; gap: 22px">' +
      '<div><a href="#" style="display: inline-block; font-size: 15px; font-weight: 600; color: #1A1712; text-decoration: none; border: 1.5px solid #1A1712; padding: 10px 18px; border-radius: 999px">← Toutes les actualités</a></div>' +
      '<div style="display: flex; flex-wrap: wrap; gap: 10px; align-items: center"><span style="font-size: 14px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #B23A0A">' + esc(a.dateLabel) + '</span>' +
      '<span style="font-size: 13px; font-weight: 600; padding: 4px 12px; border-radius: 999px; background: #F6EFE0; color: #3D372D">' + esc(a.level) + '</span>' +
      '<span style="font-size: 13px; font-weight: 600; padding: 4px 12px; border-radius: 999px; border: 1px solid #D9CFB8; color: #3D372D">' + esc(a.cat) + '</span></div>' +
      '<h1 style="margin: 0; font-family: \'Bodoni Moda\', serif; font-weight: 500; font-size: clamp(32px, 4.4vw, 56px); line-height: 1.08; max-width: 20em">' + esc(a.title) + '</h1>' +
      (a.credit ? '<p style="margin: 0; color: #4A4438; font-size: 16px">Par <strong style="color: #1A1712">' + esc(a.credit) + '</strong></p>' : '') +
      (a.hero ? '<button type="button" data-zoom="' + esc(a.hero.u) + '" aria-label="Agrandir l’image" style="padding: 0; border: 0; background: #EDE4D0; cursor: zoom-in; border-radius: 20px; overflow: hidden; display: block; margin-top: 8px"><img src="' + esc(a.hero.u) + '" alt="" style="width: 100%; max-height: 640px; object-fit: cover; display: block"></button>' : '') +
      '</div>' +
      '<div style="max-width: 760px; margin: 0 auto; padding: 40px 32px 0; display: flex; flex-direction: column; gap: 20px; font-size: 18px; line-height: 1.75; color: #24201A">' + a.blocks.map(block).join('') + '</div>' +
      '<nav aria-label="Autres articles" style="max-width: 1100px; margin: 72px auto 0; padding: 32px 32px 0; border-top: 1px solid #E7DFCC; display: flex; flex-wrap: wrap; gap: 16px; justify-content: space-between">' +
      (newer ? '<a href="#' + esc(newer.id) + '" style="flex: 1 1 300px; text-decoration: none; background: #F6EFE0; border-radius: 16px; padding: 20px 24px; color: #1A1712; display: flex; flex-direction: column; gap: 6px"><span style="font-size: 13px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #B23A0A">← Article plus récent</span><span style="font-family: \'Bodoni Moda\', serif; font-size: 19px; font-weight: 600; line-height: 1.25">' + esc(newer.title) + '</span></a>' : '') +
      (older ? '<a href="#' + esc(older.id) + '" style="flex: 1 1 300px; text-decoration: none; text-align: right; background: #F6EFE0; border-radius: 16px; padding: 20px 24px; color: #1A1712; display: flex; flex-direction: column; gap: 6px; align-items: flex-end"><span style="font-size: 13px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #B23A0A">Article précédent →</span><span style="font-family: \'Bodoni Moda\', serif; font-size: 19px; font-weight: 600; line-height: 1.25">' + esc(older.title) + '</span></a>' : '') +
      '</nav></article>';
  }

  function route() {
    var id = decodeURIComponent(location.hash.slice(1));
    var i = -1;
    for (var k = 0; k < ALL.length; k++) if (ALL[k].id === id) { i = k; break; }
    if (i >= 0) renderArticle(i); else renderList();
    window.scrollTo(0, 0);
  }

  var lb = document.getElementById('lightbox'), lbImg = document.getElementById('lb-img');
  document.addEventListener('click', function (e) {
    var z = e.target.closest('[data-zoom]');
    if (z) { lbImg.src = z.getAttribute('data-zoom'); lb.hidden = false; document.getElementById('lb-close').focus(); }
  });
  function closeLb() { lb.hidden = true; lbImg.src = ''; }
  document.getElementById('lb-close').addEventListener('click', closeLb);
  lb.addEventListener('click', function (e) { if (e.target === lb) closeLb(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !lb.hidden) closeLb(); });

  fetch('data/news.json').then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (d) { ALL = d; route(); window.addEventListener('hashchange', route); })
    .catch(function () { app.innerHTML = '<p style="max-width: 1240px; margin: 0 auto; padding: 120px 32px; font-size: 18px; color: #7A2E0B">Les actualités n’ont pas pu être chargées. Rechargez la page.</p>'; });
})();
</script>
</body>
</html>
